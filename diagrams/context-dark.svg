<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 492" width="880" height="492" role="img" aria-labelledby="t d"><title id="t">What sits in context, and what waits</title><desc id="d">SKILL.md is 137 lines and loads when the skill is invoked. Six reference files totalling about 13,900 lines open only on stated triggers, shown with bars proportional to their length.</desc><defs><marker id="ah" viewBox="0 0 8 8" refX="6.4" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0.6 1.1 L6.6 4 L0.6 6.9" fill="none" stroke="#48515c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ahA" viewBox="0 0 8 8" refX="6.4" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0.6 1.1 L6.6 4 L0.6 6.9" fill="none" stroke="#e0a53d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="64" y="26" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6e7781" font-weight="600" letter-spacing="1.4">WHAT SITS IN CONTEXT, AND WHAT WAITS</text><rect x="64" y="58" width="404" height="56" rx="8" fill="#201a0e" stroke="#e0a53d" stroke-width="1.1"/><text x="82" y="82" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#e0a53d" font-weight="600">SKILL.md</text><text x="82" y="101" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#a9b3bf">loaded when you invoke the skill</text><rect x="486" y="78" width="5.949623624782861" height="10" rx="3" fill="#a9802f"/><text x="501.9496236247829" y="87" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#e0a53d" font-weight="600">137 lines</text><text x="64" y="144" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6e7781" font-weight="600" letter-spacing="1.4">OPENED ON A STATED TRIGGER</text><text x="82" y="176" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#e6edf3">templates/rearticulated-prompt.md</text><text x="82" y="193" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6e7781">read on each run</text><line x1="68" y1="164" x2="68" y2="196" stroke="#48515c" stroke-width="1.6" stroke-linecap="round"/><rect x="486" y="170" width="17.197452229299365" height="10" rx="3" fill="#343c46"/><text x="513.1974522292994" y="179" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#a9b3bf">396 lines</text><text x="82" y="222" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#e6edf3">references/models/ and model-notes.md</text><text x="82" y="239" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6e7781">a model is named, or a flag is passed</text><line x1="68" y1="210" x2="68" y2="242" stroke="#2a3038" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 3"/><rect x="486" y="216" width="300.0" height="10" rx="3" fill="#343c46"/><text x="796.0" y="225" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#a9b3bf">6,908 lines</text><text x="82" y="268" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#e6edf3">references/technique-catalog.md</text><text x="82" y="285" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6e7781">porting a prompt, or you ask why</text><line x1="68" y1="256" x2="68" y2="288" stroke="#2a3038" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 3"/><rect x="486" y="262" width="156.86160972785177" height="10" rx="3" fill="#343c46"/><text x="652.8616097278518" y="271" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#a9b3bf">3,612 lines</text><text x="82" y="314" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#e6edf3">references/snippet-library.md</text><text x="82" y="331" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6e7781">grafting a block not in the template</text><line x1="68" y1="302" x2="68" y2="334" stroke="#2a3038" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 3"/><rect x="486" y="308" width="65.05500868558194" height="10" rx="3" fill="#343c46"/><text x="561.0550086855819" y="317" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#a9b3bf">1,498 lines</text><text x="82" y="360" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#e6edf3">examples/rearticulations.md</text><text x="82" y="377" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6e7781">no taxonomy row fits</text><line x1="68" y1="348" x2="68" y2="380" stroke="#2a3038" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 3"/><rect x="486" y="354" width="38.1731325998842" height="10" rx="3" fill="#343c46"/><text x="534.1731325998842" y="363" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#a9b3bf">879 lines</text><text x="82" y="406" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#e6edf3">references/request-taxonomy.md</text><text x="82" y="423" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6e7781">two rows match, or an unusual signal</text><line x1="68" y1="394" x2="68" y2="426" stroke="#2a3038" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 3"/><rect x="486" y="400" width="16.372321945570356" height="10" rx="3" fill="#343c46"/><text x="512.3723219455703" y="409" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#a9b3bf">377 lines</text><line x1="64" y1="444" x2="816" y2="444" stroke="#2a3038" stroke-width="1.0" stroke-linecap="round"/><text x="64" y="468" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#a9b3bf">137 lines resident. The other 13,900 stay on disk until a run reaches for them.</text></svg>