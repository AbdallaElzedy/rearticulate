<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 436" width="880" height="436" role="img" aria-labelledby="t d"><title id="t">How the target model is resolved</title><desc id="d">Three precedence rules, first match wins: a model flag, then a model named for the deliverable, otherwise the session model. The prompt content follows the target profile while narration, verification and delegation follow the model actually running the session.</desc><defs><marker id="ah" viewBox="0 0 8 8" refX="6.4" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0.6 1.1 L6.6 4 L0.6 6.9" fill="none" stroke="#48515c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ahA" viewBox="0 0 8 8" refX="6.4" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0.6 1.1 L6.6 4 L0.6 6.9" fill="none" stroke="#e0a53d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="64" y="26" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6e7781" font-weight="600" letter-spacing="1.4">WHICH PROFILE WRITES THE PROMPT</text><rect x="64" y="62" width="392" height="54" rx="8" fill="#0f141a" stroke="#2a3038" stroke-width="1.0"/><text x="82" y="85" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#6e7781" font-weight="600">1</text><text x="102" y="85" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e6edf3" font-weight="600">a model flag is passed</text><text x="102" y="103" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#6e7781">/rearticulate --model opus-5 …</text><path d="M466 89 H522" stroke="#e0a53d" stroke-width="1.1" fill="none" marker-end="url(#ahA)"/><text x="534" y="93" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e0a53d" font-weight="600">that profile</text><text x="534" y="110" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6e7781">first match wins</text><rect x="64" y="132" width="392" height="54" rx="8" fill="#0f141a" stroke="#2a3038" stroke-width="1.0"/><text x="82" y="155" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#6e7781" font-weight="600">2</text><text x="102" y="155" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e6edf3" font-weight="600">a model is named for the deliverable</text><text x="102" y="173" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#6e7781">"write a system prompt for Sonnet 5"</text><path d="M466 159 H522" stroke="#48515c" stroke-width="1.1" fill="none" marker-end="url(#ah)"/><text x="534" y="163" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e6edf3">that profile</text><rect x="64" y="202" width="392" height="54" rx="8" fill="#0f141a" stroke="#2a3038" stroke-width="1.0"/><text x="82" y="225" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#6e7781" font-weight="600">3</text><text x="102" y="225" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e6edf3" font-weight="600">neither</text><text x="102" y="243" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#6e7781">the ordinary case</text><path d="M466 229 H522" stroke="#48515c" stroke-width="1.1" fill="none" marker-end="url(#ah)"/><text x="534" y="233" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e6edf3">the model running the session</text><line x1="64" y1="288" x2="816" y2="288" stroke="#2a3038" stroke-width="1.0" stroke-linecap="round"/><text x="64" y="314" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6e7781" font-weight="600" letter-spacing="1.4">TWO DIMENSIONS, KEPT APART</text><circle cx="68" cy="343" r="2.6" fill="#48515c"/><text x="82" y="347" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" font-weight="600">what the prompt says</text><text x="282" y="347" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#a9b3bf">follows the target profile</text><circle cx="68" cy="369" r="2.6" fill="#48515c"/><text x="82" y="373" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" font-weight="600">how the session behaves</text><text x="282" y="373" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#a9b3bf">follows the model actually running it</text><line x1="64" y1="402" x2="816" y2="402" stroke="#2a3038" stroke-width="1.0" stroke-linecap="round"/><text x="64" y="428" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#a9b3bf">A model mentioned in passing changes nothing.</text></svg>