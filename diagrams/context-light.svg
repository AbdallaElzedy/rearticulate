<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 492" width="880" height="492" role="img" aria-labelledby="t d"><title id="t">What sits in context, and what waits</title><desc id="d">SKILL.md is 130 lines and loads when the skill is invoked. Six reference files totalling about 11,900 lines open only on stated triggers, shown with bars proportional to their length.</desc><defs><marker id="ah" viewBox="0 0 8 8" refX="6.4" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0.6 1.1 L6.6 4 L0.6 6.9" fill="none" stroke="#b6bec9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ahA" viewBox="0 0 8 8" refX="6.4" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0.6 1.1 L6.6 4 L0.6 6.9" fill="none" stroke="#b45309" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="64" y="26" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#9ca3af" font-weight="600" letter-spacing="1.4">WHAT SITS IN CONTEXT, AND WHAT WAITS</text><rect x="64" y="58" width="404" height="56" rx="8" fill="#fdf6e7" stroke="#b45309" stroke-width="1.1"/><text x="82" y="82" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#b45309" font-weight="600">SKILL.md</text><text x="82" y="101" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#4b5563">loaded when you invoke the skill</text><rect x="486" y="78" width="7.203546361285556" height="10" rx="3" fill="#c98a2e"/><text x="503.20354636128553" y="87" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#b45309" font-weight="600">130 lines</text><text x="64" y="144" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#9ca3af" font-weight="600" letter-spacing="1.4">OPENED ON A STATED TRIGGER</text><text x="82" y="176" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#111827">templates/rearticulated-prompt.md</text><text x="82" y="193" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9ca3af">read on each run</text><line x1="68" y1="164" x2="68" y2="196" stroke="#b6bec9" stroke-width="1.6" stroke-linecap="round"/><rect x="486" y="170" width="20.50240118212043" height="10" rx="3" fill="#ccd3dc"/><text x="516.5024011821204" y="179" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#4b5563">370 lines</text><text x="82" y="222" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#111827">references/models/ and model-notes.md</text><text x="82" y="239" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9ca3af">a model is named, or a flag is passed</text><line x1="68" y1="210" x2="68" y2="242" stroke="#e5e7eb" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 3"/><rect x="486" y="216" width="300.0" height="10" rx="3" fill="#ccd3dc"/><text x="796.0" y="225" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#4b5563">5,414 lines</text><text x="82" y="268" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#111827">references/technique-catalog.md</text><text x="82" y="285" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9ca3af">porting a prompt, or you ask why</text><line x1="68" y1="256" x2="68" y2="288" stroke="#e5e7eb" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 3"/><rect x="486" y="262" width="200.0369412633912" height="10" rx="3" fill="#ccd3dc"/><text x="696.0369412633912" y="271" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#4b5563">3,610 lines</text><text x="82" y="314" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#111827">references/snippet-library.md</text><text x="82" y="331" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9ca3af">grafting a block not in the template</text><line x1="68" y1="302" x2="68" y2="334" stroke="#e5e7eb" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 3"/><rect x="486" y="308" width="72.201699298116" height="10" rx="3" fill="#ccd3dc"/><text x="568.201699298116" y="317" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#4b5563">1,303 lines</text><text x="82" y="360" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#111827">examples/rearticulations.md</text><text x="82" y="377" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9ca3af">no taxonomy row fits</text><line x1="68" y1="348" x2="68" y2="380" stroke="#e5e7eb" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 3"/><rect x="486" y="354" width="48.5962319911341" height="10" rx="3" fill="#ccd3dc"/><text x="544.5962319911341" y="363" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#4b5563">877 lines</text><text x="82" y="406" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#111827">references/request-taxonomy.md</text><text x="82" y="423" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9ca3af">two rows match, or an unusual signal</text><line x1="68" y1="394" x2="68" y2="426" stroke="#e5e7eb" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 3"/><rect x="486" y="400" width="18.0642777983007" height="10" rx="3" fill="#ccd3dc"/><text x="514.0642777983007" y="409" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#4b5563">326 lines</text><line x1="64" y1="444" x2="816" y2="444" stroke="#e5e7eb" stroke-width="1.0" stroke-linecap="round"/><text x="64" y="468" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#4b5563">130 lines resident. The other 11,900 stay on disk until a run reaches for them.</text></svg>