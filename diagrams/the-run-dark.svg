<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 606" width="880" height="606" role="img" aria-labelledby="t d"><title id="t">How a run works</title><desc id="d">Seven numbered steps. Steps one to four happen in thinking: classify, golden-rule pass, compose, convert. Step five puts the prompt on screen with its assumptions, and a dry run stops there. Steps six and seven execute and verify, ending in a recap that reads on its own.</desc><defs><marker id="ah" viewBox="0 0 8 8" refX="6.4" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0.6 1.1 L6.6 4 L0.6 6.9" fill="none" stroke="#48515c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ahA" viewBox="0 0 8 8" refX="6.4" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0.6 1.1 L6.6 4 L0.6 6.9" fill="none" stroke="#e0a53d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="64" y="26" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6e7781" font-weight="600" letter-spacing="1.4">A RUN, START TO FINISH</text><line x1="98" y1="52" x2="98" y2="506" stroke="#2a3038" stroke-width="1.2" stroke-linecap="round"/><rect x="64" y="38" width="752" height="254" rx="10" fill="#13181f" stroke="#2a3038" stroke-width="1.0"/><text x="802" y="56" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6e7781" font-weight="600" text-anchor="end" letter-spacing="1.4">IN THINKING, NOTHING ON SCREEN</text><line x1="64" y1="322" x2="816" y2="322" stroke="#2a3038" stroke-width="1.0" stroke-linecap="round"/><rect x="86" y="312" width="104" height="20" rx="10" fill="#0f141a"/><text x="96" y="326" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6e7781" font-weight="600" letter-spacing="1.4">WHAT YOU SEE</text><circle cx="98" cy="56" r="12.5" fill="#0f141a" stroke="#48515c" stroke-width="1.1"/><text x="98" y="60.2" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#e6edf3" font-weight="600" text-anchor="middle">1</text><text x="132" y="61" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#e6edf3" font-weight="600">classify</text><text x="132" y="81" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#a9b3bf">request type, session model, target model,</text><text x="132" y="97" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#a9b3bf">files named, steps with outside reach</text><circle cx="98" cy="128" r="12.5" fill="#0f141a" stroke="#48515c" stroke-width="1.1"/><text x="98" y="132.2" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#e6edf3" font-weight="600" text-anchor="middle">2</text><text x="132" y="133" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#e6edf3" font-weight="600">golden-rule pass</text><text x="132" y="153" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#a9b3bf">what a colleague with no context would ask,</text><text x="132" y="169" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#a9b3bf">answered from the repository first</text><circle cx="98" cy="200" r="12.5" fill="#0f141a" stroke="#48515c" stroke-width="1.1"/><text x="98" y="204.2" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#e6edf3" font-weight="600" text-anchor="middle">3</text><text x="132" y="205" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#e6edf3" font-weight="600">compose</text><text x="132" y="225" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#a9b3bf">fill the template in fixed tag order</text><circle cx="98" cy="256" r="12.5" fill="#0f141a" stroke="#48515c" stroke-width="1.1"/><text x="98" y="260.2" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#e6edf3" font-weight="600" text-anchor="middle">4</text><text x="132" y="261" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#e6edf3" font-weight="600">convert</text><text x="132" y="281" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#a9b3bf">rewrite the phrasing current models handle poorly</text><circle cx="98" cy="356" r="12.5" fill="#201a0e" stroke="#e0a53d" stroke-width="1.1"/><text x="98" y="360.2" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#e0a53d" font-weight="600" text-anchor="middle">5</text><text x="132" y="361" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#e0a53d" font-weight="600">the prompt, on screen</text><text x="132" y="381" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#a9b3bf">with the target model, the assumptions made,</text><text x="132" y="397" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#a9b3bf">and the wording that changed</text><circle cx="98" cy="428" r="12.5" fill="#0f141a" stroke="#48515c" stroke-width="1.1"/><text x="98" y="432.2" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#e6edf3" font-weight="600" text-anchor="middle">6</text><text x="132" y="433" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#e6edf3" font-weight="600">execute</text><text x="132" y="453" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#a9b3bf">independent calls batched, files read before</text><text x="132" y="469" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#a9b3bf">claims about them, flagged steps wait for you</text><circle cx="98" cy="500" r="12.5" fill="#0f141a" stroke="#48515c" stroke-width="1.1"/><text x="98" y="504.2" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#e6edf3" font-weight="600" text-anchor="middle">7</text><text x="132" y="505" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#e6edf3" font-weight="600">verify</text><text x="132" y="525" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#a9b3bf">run the checks it wrote, confirm the files</text><text x="132" y="541" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#a9b3bf">touched match the ones the task named</text><line x1="310" y1="356" x2="322" y2="356" stroke="#2a3038" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="2 3"/><rect x="328" y="344" width="182" height="25" rx="12" fill="#0f141a" stroke="#2a3038" stroke-width="1.0" stroke-dasharray="3 3"/><text x="342" y="361" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6e7781">a dry run stops here</text><line x1="98" y1="520" x2="98" y2="554" stroke="#48515c" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 4"/><path d="M98 552 v6" stroke="#48515c" stroke-width="1.1" marker-end="url(#ah)" fill="none"/><text x="132" y="566" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e6edf3" font-weight="600">a recap that reads on its own</text></svg>